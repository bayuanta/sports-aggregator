name: Update Matches Data

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  update-matches:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Updated to 24 due to deprecation warning
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci || npm install
        
      - name: Run Update Script
        env:
          # These secrets need to be configured in your GitHub repository settings
          SPORT_SRC_API_KEY: ${{ secrets.SPORT_SRC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/update_matches.js
